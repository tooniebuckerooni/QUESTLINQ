<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 140" role="img" aria-label="QuestLinq — Events That Bring Us Together (provisional wordmark)">
  <!-- PROVISIONAL wordmark lockup. Production version should use the final
       logotype outlines (convert text to paths with the licensed display font). -->
  <defs>
    <linearGradient id="wmGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFC64B"/>
      <stop offset="1" stop-color="#E8740C"/>
    </linearGradient>
    <linearGradient id="wmTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5A623"/>
      <stop offset="0.35" stop-color="#2EC4B6"/>
      <stop offset="1" stop-color="#1FA8D8"/>
    </linearGradient>
  </defs>

  <rect width="640" height="140" fill="#161022"/>

  <g font-family="'Montserrat', 'Arial Black', Arial, sans-serif" font-style="italic" font-weight="900">
    <text x="36" y="82" font-size="64" letter-spacing="1">
      <tspan fill="url(#wmGold)">QUEST</tspan><tspan fill="url(#wmTeal)">LINQ</tspan>
    </text>
  </g>

  <line x1="40" y1="102" x2="600" y2="102" stroke="#F5A623" stroke-opacity="0.5" stroke-width="1"/>

  <text x="320" y="124" text-anchor="middle" font-family="'Inter', 'Segoe UI', Arial, sans-serif"
        font-size="17" letter-spacing="6" fill="#FFE9B8">EVENTS THAT BRING US TOGETHER</text>
</svg>
